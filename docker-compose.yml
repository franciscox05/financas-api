services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
      POSTGRES_DB: financas_api
    ports:
      - "5433:5432"
    volumes:
      - financas_api_db:/var/lib/postgresql/data

volumes:
  financas_api_db:
