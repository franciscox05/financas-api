openapi: 3.0.3
info:
  title: financas-api
  description: REST API for personal finance management — categories, transactions and budgets, scoped per user.
  version: "1.0.0"
servers:
  - url: http://localhost:3001

tags:
  - name: Auth
  - name: Categories
  - name: Transactions
  - name: Budgets

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [INCOME, EXPENSE] }
        color: { type: string, nullable: true }

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        amount: { type: string, example: "45.50" }
        description: { type: string, nullable: true }
        type: { type: string, enum: [INCOME, EXPENSE] }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Budget:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        amountLimit: { type: string, example: "200.00" }
        period: { type: string, example: "2026-10" }

    Error:
      type: object
      properties:
        error: { type: string }

  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found or not owned by the authenticated user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Auth]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { description: Email already in use }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [INCOME, EXPENSE] }
                color: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Categories]
      summary: Update a category
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [INCOME, EXPENSE] }
                color: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Categories]
      summary: Delete a category
      responses:
        "204": { description: No content }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [INCOME, EXPENSE] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      tags: [Transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, amount, type, date]
              properties:
                categoryId: { type: string, format: uuid }
                amount: { type: number, exclusiveMinimum: 0 }
                description: { type: string }
                type: { type: string, enum: [INCOME, EXPENSE] }
                date: { type: string, format: date }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /transactions/summary:
    get:
      tags: [Transactions]
      summary: Totals aggregated by category and type
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string }
                    type: { type: string, enum: [INCOME, EXPENSE] }
                    total: { type: string }

  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Transactions]
      summary: Get a transaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Transactions]
      summary: Update a transaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      responses:
        "204": { description: No content }
        "404": { $ref: "#/components/responses/NotFound" }

  /budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Budget" }
    post:
      tags: [Budgets]
      summary: Create a budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, amountLimit, period]
              properties:
                categoryId: { type: string, format: uuid }
                amountLimit: { type: number, exclusiveMinimum: 0 }
                period: { type: string, example: "2026-10", pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /budgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Budgets]
      summary: Delete a budget
      responses:
        "204": { description: No content }
        "404": { $ref: "#/components/responses/NotFound" }

  /budgets/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Budgets]
      summary: Amount spent vs. limit for the budget's period
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  budget: { $ref: "#/components/schemas/Budget" }
                  spent: { type: string }
                  remaining: { type: number }
        "404": { $ref: "#/components/responses/NotFound" }
